<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; margin: 12px; width: 560px; }
    .columns { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 20px; }
    .field + .field { margin-top: 14px; }
    .field > label { display: block; margin-bottom: 4px; font-weight: 600; }
    .select-row { display: flex; gap: 6px; }
    select { flex: 1; min-width: 0; padding: 4px; }
    .options { border-left: 1px solid #ddd; padding-left: 16px; }
    .options h2 { font-size: 14px; margin: 0 0 8px; }
    .check { display: flex; gap: 8px; align-items: flex-start; }
    .check + .check { margin-top: 10px; }
    .check input { margin-top: 3px; }
    #status { display: block; min-height: 1.2em; margin-top: 10px; color: #2a7; }
    .hint { color: #777; font-size: 12px; margin: 6px 0 0; }
    #methodNote { color: #b5651d; }
  </style>
</head>
<body>
  <div class="columns">
    <div>
      <div class="field">
        <label for="inst" data-i18n="instLabel"></label>
        <div class="select-row">
          <select id="inst"></select>
          <button id="clear" data-i18n="clear" data-i18n-title="clearInstTitle"></button>
        </div>
      </div>

      <div class="field">
        <label for="method" data-i18n="methodLabel"></label>
        <div class="select-row">
          <select id="method"></select>
          <button id="clearMethod" data-i18n="clear" data-i18n-title="clearMethodTitle"></button>
        </div>
        <p class="hint" id="methodNote" hidden></p>
        <p class="hint" data-i18n="methodHint"></p>
      </div>
    </div>

    <div class="options">
      <h2 data-i18n="skipHeading"></h2>
      <div class="check">
        <input type="checkbox" id="auto">
        <label for="auto" data-i18n="skipInst"></label>
      </div>
      <div class="check">
        <input type="checkbox" id="feideAuto">
        <label for="feideAuto" data-i18n="feideAuto"></label>
      </div>
      <span id="status" role="status"></span>
    </div>
  </div>

  <script src="institutions.js"></script>
  <script src="options.js"></script>
</body>
</html>
